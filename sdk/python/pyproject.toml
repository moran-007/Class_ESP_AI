[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-maker-robot"
version = "0.5.0"
description = "Local USB Python SDK for the AI Maker ESP32-S3 teaching firmware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
drawing = ["Pillow>=12.3,<14"]

[tool.setuptools.packages.find]
where = ["src"]
